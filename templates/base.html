<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}IP Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">IP Tracker</a>
    <nav><a href="{{ url_for('ip_lookup') }}">IP lookup</a><a href="{{ url_for('asn_list') }}">ASNs</a><a href="{{ url_for('history') }}">Changes</a></nav>
    <form action="{{ url_for('search') }}" method="post"><input name="query" aria-label="Search" placeholder="IP, AS123, or name"><button>Search</button></form>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
